{% extends "admin/base.html" %}
{% load i18n %}


{% block body %}


<div class="row mx-0 align-items-center justify-content-center h-100 position-absolute w-100">
    <div class="col-sm-6">
        <div class="card bg-white shadow-sm p-3 rounded">
            <h3>
            <i class="bi bi-shield-lock"></i>
            {% trans 'Password Reset Complete' %}
            </h3>

            <p>{% translate 'Your password has been reset successfully. You can now log in with your new password.' %}</p>

            <p><a href="{% url 'palette_admin:login' %}" class="btn btn-primary ">{% translate 'Log in' %}</a></p>
        </div>
    </div>
</div>

{% endblock %}
